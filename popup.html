<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Dark Mode Reader</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Upload Section -->
    <section id="uploadSection">
      <div class="upload-container">
        <div class="logo-header">
          <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="2" width="14" height="20" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <path d="M7 7h6M7 10h6M7 13h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="18" cy="18" r="5" fill="#21B5F4" stroke="#151515" stroke-width="1.5"/>
            <path d="M16.5 18L18 19.5L20 16.5" stroke="#151515" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <h1>PDF Dark Mode</h1>
        </div>
        <p class="subtitle">Read PDFs comfortably in dark mode. Reduce eye strain with multiple themes.</p>

        <div id="dropZone" class="drop-zone">
          <input type="file" id="pdfFileInput" accept="application/pdf" hidden>
          <div class="drop-zone-content">
            <svg class="upload-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 16V4M12 4L8 8M12 4L16 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M4 14V18C4 19.1046 4.89543 20 6 20H18C19.1046 20 20 19.1046 20 18V14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <p class="drop-text">Drop PDF here or <span class="browse-link">browse</span></p>
            <p class="drop-hint">Your file stays private — processed locally</p>
          </div>
        </div>

        <div class="privacy-badge">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="5" y="11" width="14" height="10" rx="2" stroke="currentColor" stroke-width="2"/>
            <path d="M8 11V7C8 4.79086 9.79086 3 12 3C14.2091 3 16 4.79086 16 7V11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span>100% Local Processing — No Upload</span>
        </div>
      </div>
    </section>

    <!-- Preview Section (Reader) -->
    <section id="previewSection" class="hidden">
      <!-- Top Toolbar -->
      <div class="toolbar">
        <button id="backBtn" class="toolbar-btn" title="Go Back">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="toolbar-center">
          <span id="fileNameDisplay" class="file-name"></span>
          <span id="progressText" class="progress-text">Ready</span>
        </div>
        <div class="toolbar-right">
          <div class="theme-select-wrapper">
            <select id="themeSelector" class="theme-select" aria-label="Choose Theme">
              <option value="claude" selected>🌙 Warm</option>
              <option value="classic">⚫ Classic</option>
              <option value="midnight">🔵 Blue</option>
              <option value="forest">🟢 Green</option>
            </select>
            <svg class="select-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </div>
      </div>

      <!-- Main Layout -->
      <div class="reader-layout">
        <!-- Thumbnail Sidebar -->
        <aside id="thumbnailSidebar" class="thumbnail-sidebar">
          <div id="thumbnailContainer" class="thumbnail-container"></div>
        </aside>

        <!-- Toggle sidebar on mobile -->
        <button id="sidebarToggle" class="sidebar-toggle" title="Toggle Thumbnails">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 4H10V10H4V4Z M14 4H20V10H14V4Z M4 14H10V20H4V14Z M14 14H20V20H14V14Z" fill="currentColor"/></svg>
        </button>

        <!-- Main Preview Area -->
        <main class="preview-area">
          <div id="mainPreview" class="main-preview">
            <div class="placeholder-msg">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" opacity="0.3"><rect x="3" y="2" width="18" height="20" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 7h10M7 10h10M7 13h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              <p>Preview will appear here</p>
            </div>
          </div>
        </main>
      </div>
    </section>
  </div>

  <script src="lib/pdf.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
